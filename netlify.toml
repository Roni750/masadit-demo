# Web app only. The API is deployed separately on Render (see render.yaml).
[build]
  command = "npm run build -w web"
  publish = "web/dist"
  # Skip deploys when a commit doesn't touch the web app or dependencies
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- web/ package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: deep links like /history/123 must serve index.html on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and manifest must always be revalidated, or users could stay stuck on an old version
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets never change, so browsers can keep them forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep the demo out of search engines, including non-HTML files such as the manifest and icons
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
